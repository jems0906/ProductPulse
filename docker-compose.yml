services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: productpulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - productpulse-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d productpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 5000
      DATABASE_URL: postgres://postgres:postgres@db:5432/productpulse
      JWT_SECRET: change-me
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  productpulse-db:
