name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm install --prefix server --workspaces=false --no-audit --no-fund

      - name: Run API tests
        run: npm run test:api

  smoke-test:
    runs-on: ubuntu-latest
    needs: api-tests
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for app health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:5000/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "App did not become healthy in time"
          docker compose logs
          exit 1

      - name: Run smoke test
        run: npm run smoke:test

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Shutdown stack
        if: always()
        run: docker compose down -v
